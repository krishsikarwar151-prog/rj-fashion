<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | RJ Fashion</title>
  <meta name="description" content="Secure administrator login for RJ Fashion back-office management portal.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99, 102, 241, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.07) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    /* Glowing orbs */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .orb-bottom {
      position: fixed;
      bottom: -300px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .admin-login-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
    }

    .admin-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .admin-brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      margin-bottom: 0.75rem;
    }

    .admin-brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: white;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
    }

    .admin-brand-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .admin-brand-name span {
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .admin-brand-sub {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .admin-login-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow:
        0 0 0 1px rgba(99, 102, 241, 0.1),
        0 25px 50px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .card-header {
      margin-bottom: 2rem;
    }

    .card-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .card-header p {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.45);
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    .field-group {
      margin-bottom: 1.25rem;
    }

    .field-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 0.5rem;
      letter-spacing: 0.01em;
    }

    .field-wrap {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 2;
    }

    .field-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.92rem;
      font-family: 'Inter', sans-serif;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      transition: all 0.2s ease;
      outline: none;
    }

    .field-input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .field-input:focus {
      border-color: rgba(99, 102, 241, 0.6);
      background: rgba(99, 102, 241, 0.08);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .field-input.has-toggle { padding-right: 3rem; }

    .field-input.error {
      border-color: rgba(239, 68, 68, 0.6);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }

    .field-error {
      font-size: 0.78rem;
      color: #f87171;
      margin-top: 0.4rem;
      display: none;
    }

    .field-error.show { display: block; }

    .btn-pw-toggle {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.35);
      font-size: 0.9rem;
      padding: 0.25rem;
      transition: color 0.2s;
    }

    .btn-pw-toggle:hover { color: rgba(255,255,255,0.7); }

    .btn-admin-login {
      width: 100%;
      padding: 0.95rem 1.5rem;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
      letter-spacing: 0.01em;
    }

    .btn-admin-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
    }

    .btn-admin-login:active { transform: translateY(0); }

    .btn-admin-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .login-alert {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      color: #fca5a5;
      font-size: 0.85rem;
      display: none;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1rem;
    }

    .login-alert.show { display: flex; }

    .card-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 1.75rem 0 1.25rem;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover { color: rgba(255,255,255,0.7); }

    .security-note {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .fa-spin { animation: spin 0.8s linear infinite; }

    .admin-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(30, 30, 40, 0.95);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      z-index: 9999;
      transition: transform 0.3s ease;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }
    .admin-toast.show { transform: translateX(-50%) translateY(0); }
    .admin-toast.success { border-color: rgba(34, 197, 94, 0.4); }
    .admin-toast.error   { border-color: rgba(239, 68, 68, 0.4); }
  </style>
</head>
<body>
  <div class="orb-bottom"></div>

  <div class="admin-login-wrap">
    <!-- Brand -->
    <div class="admin-brand">
      <a href="index.html" class="admin-brand-logo">
        <div class="admin-brand-icon">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <span class="admin-brand-name">RJ <span>Fashion</span></span>
      </a>
      <div class="admin-brand-sub">Administration Portal</div>
    </div>

    <!-- Card -->
    <div class="admin-login-card">
      <div class="card-header">
        <div class="admin-badge">
          <i class="fa-solid fa-circle-dot" style="color: #4ade80; font-size: 0.6rem;"></i>
          Admin Access Only
        </div>
        <h1>Sign in to Dashboard</h1>
        <p>Enter your administrator credentials to access the management portal.</p>
      </div>

      <form id="adminLoginForm" novalidate autocomplete="off">
        <!-- Email -->
        <div class="field-group">
          <label class="field-label" for="adminEmail">Admin Email Address</label>
          <div class="field-wrap">
            <i class="fa-regular fa-envelope field-icon"></i>
            <input
              type="email"
              id="adminEmail"
              class="field-input"
              placeholder="admin@gmail.com"
              autocomplete="username"
              required
            >
          </div>
          <div class="field-error" id="emailError"></div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label class="field-label" for="adminPassword">Admin Password</label>
          <div class="field-wrap">
            <i class="fa-solid fa-lock field-icon"></i>
            <input
              type="password"
              id="adminPassword"
              class="field-input has-toggle"
              placeholder="••••••••••"
              autocomplete="current-password"
              required
            >
            <button type="button" class="btn-pw-toggle" id="toggleAdminPw" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye" id="toggleAdminPwIcon"></i>
            </button>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <!-- Error Alert -->
        <div class="login-alert" id="loginAlert">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span id="loginAlertText">Invalid administrator credentials.</span>
        </div>

        <button type="submit" class="btn-admin-login" id="btnAdminLogin">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          Access Admin Dashboard
        </button>
      </form>

      <hr class="card-divider">

      <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        Return to Customer Storefront
      </a>
    </div>

    <div class="security-note">
      <i class="fa-solid fa-lock"></i>
      Secured with Firebase Authentication &middot; Admin access only
    </div>
  </div>

  <!-- Toast -->
  <div class="admin-toast" id="adminToast"></div>

  <script src="js/main.js"></script>
  <script src="js/firebase.js"></script>
  <script>
    // =========================================================================
    // Admin Login Page Script
    // IMPORTANT: Change ADMIN_EMAIL below to your actual admin Gmail address
    // =========================================================================
    const ADMIN_EMAIL = "rjfashionadmin@gmail.com"; // <-- Your admin Gmail here

    // If already logged in as admin, redirect immediately
    (function checkAlreadyLoggedIn() {
      try {
        const storage = window.RJFashionStorage || window.ShopNovaStorage;
        if (storage) {
          const user = storage.getCurrentUser();
          if (user && user.role === "admin") {
            window.location.replace("admin.html");
          }
        }
      } catch (e) {}
    })();

    document.addEventListener("DOMContentLoaded", () => {
      const form       = document.getElementById("adminLoginForm");
      const emailInput = document.getElementById("adminEmail");
      const pwInput    = document.getElementById("adminPassword");
      const submitBtn  = document.getElementById("btnAdminLogin");
      const alertBox   = document.getElementById("loginAlert");
      const alertText  = document.getElementById("loginAlertText");
      const emailErr   = document.getElementById("emailError");
      const pwErr      = document.getElementById("passwordError");

      // Password toggle
      document.getElementById("toggleAdminPw").addEventListener("click", () => {
        const icon = document.getElementById("toggleAdminPwIcon");
        if (pwInput.type === "password") {
          pwInput.type = "text";
          icon.className = "fa-regular fa-eye-slash";
        } else {
          pwInput.type = "password";
          icon.className = "fa-regular fa-eye";
        }
      });

      emailInput.addEventListener("input", () => { clearErr(emailInput, emailErr); hideAlert(); });
      pwInput.addEventListener("input",    () => { clearErr(pwInput, pwErr);     hideAlert(); });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert();

        const email    = emailInput.value.trim().toLowerCase();
        const password = pwInput.value;
        let hasError   = false;

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          showErr(emailInput, emailErr, "Please enter a valid email address.");
          hasError = true;
        }
        if (!password || password.length < 6) {
          showErr(pwInput, pwErr, "Password must be at least 6 characters.");
          hasError = true;
        }
        if (hasError) return;

        // Block non-admin emails immediately
        if (email !== ADMIN_EMAIL.toLowerCase()) {
          showAlert("Access denied. This portal is for administrators only.");
          showToast("Access denied — admin only.", "error");
          return;
        }

        setLoading(true);

        try {
          let authed    = false;
          let adminUser = null;

          // 1. Try Firebase Authentication
          if (window.RJFirebase) {
            try {
              const res = await window.RJFirebase.authSignIn(email, password);
              adminUser = res.user;
              authed    = true;
            } catch (fbErr) {
              // Fall through to local storage check
            }
          }

          // 2. Local storage fallback
          if (!authed) {
            const storage = window.RJFashionStorage || window.ShopNovaStorage;
            if (storage) {
              const users = storage.getUsers();
              const match = users.find(u =>
                (u.email || "").toLowerCase() === email && u.password === password
              );
              if (match) {
                adminUser = match;
                storage.setCurrentUser(match);
                authed = true;
              }
            }
          }

          if (!authed || !adminUser) {
            showAlert("Incorrect password. Please try again.");
            showToast("Authentication failed.", "error");
            return;
          }

          // 3. Confirm admin role
          if (adminUser.role !== "admin") {
            showAlert("Access denied. Your account does not have administrator privileges.");
            showToast("Not an admin account.", "error");
            if (window.RJFirebase) window.RJFirebase.authSignOut().catch(() => {});
            return;
          }

          // Success — save session and redirect
          const storage = window.RJFashionStorage || window.ShopNovaStorage;
          if (storage) storage.setCurrentUser(adminUser);

          showToast("Welcome back, Admin! Redirecting…", "success");
          setTimeout(() => { window.location.href = "admin.html"; }, 700);

        } catch (err) {
          showAlert(err.message || "Login failed. Please check your credentials.");
          showToast(err.message || "Login failed.", "error");
        } finally {
          setLoading(false);
        }
      });

      function setLoading(on) {
        submitBtn.disabled  = on;
        submitBtn.innerHTML = on
          ? `<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...`
          : `<i class="fa-solid fa-arrow-right-to-bracket"></i> Access Admin Dashboard`;
      }

      function showErr(input, errEl, msg) {
        input.classList.add("error");
        errEl.textContent = msg;
        errEl.classList.add("show");
      }

      function clearErr(input, errEl) {
        input.classList.remove("error");
        errEl.textContent = "";
        errEl.classList.remove("show");
      }

      function showAlert(msg) {
        alertText.textContent = msg;
        alertBox.classList.add("show");
      }

      function hideAlert() { alertBox.classList.remove("show"); }

      function showToast(msg, type = "info") {
        const toast = document.getElementById("adminToast");
        toast.textContent = msg;
        toast.className   = `admin-toast ${type} show`;
        setTimeout(() => { toast.classList.remove("show"); }, 3500);
      }
    });
  </script>
</body>
</html>
